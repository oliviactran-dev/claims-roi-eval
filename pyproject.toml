[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "claims-roi-eval"
version = "0.1.0"
description = "Spec-driven program evaluation from claims data: cohorts, propensity weighting, DiD diagnostics, and ROI."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "duckdb>=1.0",
    "numpy>=1.24",
    "pandas>=2.0",
    "pyarrow>=14",
    "pyyaml>=6",
]

[project.optional-dependencies]
dbt = ["dbt-duckdb>=1.9"]
dev = ["pytest>=8"]

[project.scripts]
claims-roi = "claims_roi_eval.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
